<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142524">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Forge POC">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>DeckForge · PWA Lab</title>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header><button id="home-button" data-action="home" aria-label="Back to Home" class="quiet">‹</button><h1 id="page-title">DeckForge</h1><button id="rename-button" data-action="quick-rename" aria-label="Rename deck" class="quiet" hidden>✎</button><button id="settings-button" data-action="settings" aria-label="Settings" class="quiet">⚙︎</button></header>
  <p id="notice" role="status" aria-live="polite"></p>
  <main id="app" tabindex="-1" aria-labelledby="page-title"><p>Opening your local deck library…</p></main>
  <nav id="main-tabs" aria-label="Main navigation"></nav>
  <footer><span id="connection">Checking connection…</span><span id="offline-status">Offline setup pending</span></footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
